<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="455" viewBox="0 0 1600 455">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFE"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C69F"/>
      <stop offset="0.58" stop-color="#DAB78C"/>
      <stop offset="0.59" stop-color="#C29B70"/>
      <stop offset="1" stop-color="#AE835B"/>
    </linearGradient>
    <linearGradient id="assess" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FBFE"/>
      <stop offset="1" stop-color="#F1F6FC"/>
    </linearGradient>
    <linearGradient id="update" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FAF4"/>
      <stop offset="1" stop-color="#E8F5EB"/>
    </linearGradient>
    <marker id="arrowNavy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#0B2E6D"/>
    </marker>
    <marker id="arrowStep" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0B2E6D"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#E11D2E"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#174EA6"/>
    </marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700;fill:#082B66}
      .body{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#1D2939}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#475467}
      .symbol{font-family:Arial,Helvetica,sans-serif;font-style:italic;fill:#172B4D}
      .navy{fill:#0B2E6D}.blue{fill:#174EA6}.red{fill:#E11D2E}.green{fill:#166534}
      .axis{stroke:#111827;stroke-width:1.7}.grid{stroke:#98A2B3;stroke-width:1.3;stroke-dasharray:6 5}
    </style>
  </defs>

  <rect x="7" y="7" width="1586" height="441" rx="18" fill="url(#bg)" stroke="#C8D2DF" stroke-width="1.5"/>

  <!-- 1. Repetitive loading -->
  <text x="205" y="42" text-anchor="middle" class="title">1. Repetitive Loading</text>
  <text x="205" y="70" text-anchor="middle" class="title">on Soft Clay</text>

  <rect x="42" y="176" width="324" height="154" rx="4" fill="url(#clay)" stroke="#B88B62"/>
  <rect x="42" y="163" width="324" height="18" fill="#8D949D"/>
  <line x1="74" y1="163" x2="74" y2="100" stroke="#9CA3AF" stroke-width="10" opacity="0.55"/>
  <line x1="334" y1="163" x2="334" y2="100" stroke="#9CA3AF" stroke-width="10" opacity="0.55"/>

  <g stroke="#E11D2E" stroke-width="2.7">
    <line x1="105" y1="106" x2="105" y2="147" marker-end="url(#arrowRed)"/>
    <line x1="105" y1="147" x2="105" y2="106" marker-end="url(#arrowRed)"/>
    <line x1="143" y1="106" x2="143" y2="147" marker-end="url(#arrowRed)"/>
    <line x1="143" y1="147" x2="143" y2="106" marker-end="url(#arrowRed)"/>
    <line x1="181" y1="106" x2="181" y2="147" marker-end="url(#arrowRed)"/>
    <line x1="181" y1="147" x2="181" y2="106" marker-end="url(#arrowRed)"/>
    <line x1="219" y1="106" x2="219" y2="147" marker-end="url(#arrowRed)"/>
    <line x1="219" y1="147" x2="219" y2="106" marker-end="url(#arrowRed)"/>
    <line x1="257" y1="106" x2="257" y2="147" marker-end="url(#arrowRed)"/>
    <line x1="257" y1="147" x2="257" y2="106" marker-end="url(#arrowRed)"/>
    <line x1="295" y1="106" x2="295" y2="147" marker-end="url(#arrowRed)"/>
    <line x1="295" y1="147" x2="295" y2="106" marker-end="url(#arrowRed)"/>
  </g>
  <text x="350" y="127" class="body red" style="font-size:20px;font-style:italic">Δσ</text>
  <text x="204" y="241" text-anchor="middle" class="body" style="font-size:20px">Normally</text>
  <text x="204" y="268" text-anchor="middle" class="body" style="font-size:20px">Consolidated Clay</text>

  <!-- arrow 1 -->
  <line x1="400" y1="222" x2="423" y2="222" stroke="#0B2E6D" stroke-width="2.4" marker-end="url(#arrowStep)"/>

  <!-- 2. Long-term response -->
  <text x="615" y="42" text-anchor="middle" class="title">2. Long-Term Response</text>
  <text x="615" y="70" text-anchor="middle" class="title">(<tspan font-style="italic">e</tspan>–<tspan font-style="italic">i</tspan> Behavior)</text>

  <line x1="477" y1="102" x2="477" y2="330" class="axis" marker-end="url(#arrowNavy)"/>
  <line x1="477" y1="330" x2="791" y2="330" class="axis" marker-end="url(#arrowNavy)"/>
  <text x="447" y="100" class="symbol" style="font-size:20px">e</text>
  <text x="773" y="353" class="symbol" style="font-size:18px">i</text>
  <text x="793" y="353" class="small">(cycles)</text>

  <path d="M486 143 C530 181 570 211 620 232 C674 255 728 275 773 282" fill="none" stroke="#E11D2E" stroke-width="3.2"/>
  <line x1="477" y1="232" x2="620" y2="232" stroke="#E11D2E" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="620" y1="232" x2="620" y2="330" class="grid"/>
  <line x1="477" y1="294" x2="785" y2="294" class="grid"/>
  <circle cx="620" cy="232" r="5.5" fill="#E11D2E"/>
  <text x="441" y="148" text-anchor="end" class="body"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="12">static</tspan></text>
  <text x="441" y="300" text-anchor="end" class="body"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="12">T</tspan></text>
  <text x="620" y="357" text-anchor="middle" class="body red"><tspan font-style="italic">N</tspan><tspan baseline-shift="super" font-size="13">*</tspan></text>
  <text x="780" y="284" class="body red"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="12">T</tspan> at <tspan font-style="italic">i</tspan> = ∞</text>

  <!-- arrow 2 -->
  <line x1="824" y1="222" x2="847" y2="222" stroke="#0B2E6D" stroke-width="2.4" marker-end="url(#arrowStep)"/>

  <!-- 3. Settlement assessment -->
  <text x="1022" y="42" text-anchor="middle" class="title">3. Settlement Assessment</text>
  <text x="1022" y="70" text-anchor="middle" class="title">(How much? How fast?)</text>

  <rect x="878" y="98" width="290" height="235" rx="16" fill="url(#assess)" stroke="#BFD0E6" stroke-width="1.5"/>
  <rect x="907" y="123" width="97" height="52" rx="9" fill="#F6F9FE" stroke="#77A2E8"/>
  <text x="956" y="156" text-anchor="middle" class="body navy" style="font-size:22px;font-weight:700"><tspan font-style="italic">S</tspan><tspan baseline-shift="sub" font-size="13">static</tspan></text>
  <text x="1022" y="156" text-anchor="middle" class="body navy" style="font-size:28px;font-weight:700">+</text>
  <rect x="1040" y="123" width="100" height="52" rx="9" fill="#FFF8F8" stroke="#F06B73"/>
  <text x="1090" y="156" text-anchor="middle" class="body red" style="font-size:22px;font-weight:700">Δ<tspan font-style="italic">S</tspan><tspan baseline-shift="sub" font-size="13">T</tspan></text>
  <line x1="1023" y1="185" x2="1023" y2="197" stroke="#0B2E6D" stroke-width="2.0" marker-end="url(#arrowStep)"/>
  <rect x="967" y="211" width="112" height="42" rx="8" fill="#0B2E6D"/>
  <text x="1023" y="238" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;font-style:italic;fill:white">S<tspan baseline-shift="sub" font-size="12">total</tspan></text>

  <g transform="translate(903,277)">
    <rect x="0" y="9" width="3" height="13" fill="#174EA6"/><rect x="5" y="4" width="3" height="18" fill="#174EA6"/><rect x="10" y="0" width="3" height="22" fill="#174EA6"/><rect x="15" y="6" width="3" height="16" fill="#174EA6"/>
    <text x="31" y="18" class="body">How much settlement will occur?</text>
  </g>
  <g transform="translate(903,306)">
    <circle cx="10" cy="10" r="9" fill="none" stroke="#E11D2E" stroke-width="2"/>
    <line x1="10" y1="10" x2="10" y2="4" stroke="#E11D2E" stroke-width="2"/><line x1="10" y1="10" x2="15" y2="12" stroke="#E11D2E" stroke-width="2"/>
    <text x="31" y="16" class="body">How fast does it accumulate?</text>
  </g>

  <!-- arrow 3 -->
  <line x1="1201" y1="222" x2="1224" y2="222" stroke="#0B2E6D" stroke-width="2.4" marker-end="url(#arrowStep)"/>

  <!-- 4. Monitoring update -->
  <text x="1402" y="42" text-anchor="middle" class="title">4. Monitoring-Based</text>
  <text x="1402" y="70" text-anchor="middle" class="title">Update</text>

  <line x1="1268" y1="104" x2="1268" y2="270" class="axis" marker-end="url(#arrowNavy)"/>
  <line x1="1268" y1="270" x2="1548" y2="270" class="axis" marker-end="url(#arrowNavy)"/>
  <text x="1247" y="103" class="symbol" style="font-size:19px">e</text>
  <text x="1495" y="293" class="symbol" style="font-size:17px">i</text>
  <text x="1511" y="293" class="small">(cycles)</text>

  <path d="M1279 126 C1311 156 1342 181 1385 201 C1427 221 1471 235 1535 245" fill="none" stroke="#174EA6" stroke-width="3.1"/>
  <g fill="#2468D8">
    <circle cx="1280" cy="127" r="6"/><circle cx="1305" cy="154" r="6"/><circle cx="1333" cy="176" r="6"/><circle cx="1358" cy="190" r="6"/><circle cx="1381" cy="200" r="6"/><circle cx="1408" cy="211" r="6"/><circle cx="1439" cy="220" r="6"/>
  </g>
  <line x1="1439" y1="185" x2="1439" y2="270" class="grid"/>
  <text x="1343" y="118" class="body blue" style="font-weight:700">Measured</text>
  <text x="1346" y="139" class="body blue" style="font-weight:700"><tspan font-style="italic">i</tspan>–<tspan font-style="italic">e</tspan> data</text>
  <line x1="1375" y1="145" x2="1365" y2="177" stroke="#174EA6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1480" y="147" class="body blue" style="font-weight:700">Updated</text>
  <text x="1475" y="168" class="body blue" style="font-weight:700">prediction</text>
  <line x1="1506" y1="174" x2="1495" y2="211" stroke="#174EA6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="1261" y="309" width="290" height="67" rx="11" fill="url(#update)" stroke="#66A66E"/>
  <g transform="translate(1279,323)" fill="none" stroke="#166534" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 18 A16 16 0 0 1 35 8"/>
    <polyline points="35,3 35,11 27,11"/>
    <path d="M38 18 A16 16 0 0 1 11 28"/>
    <polyline points="11,33 11,25 19,25"/>
  </g>
  <text x="1417" y="338" text-anchor="middle" class="body green" style="font-size:19px;font-weight:700">Update <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="12">T</tspan>, <tspan font-style="italic">N</tspan><tspan baseline-shift="super" font-size="12">*</tspan>, <tspan font-style="italic">m</tspan></text>
  <text x="1417" y="362" text-anchor="middle" class="body green">Model calibration</text>

  <!-- feedback loop -->
  <path d="M1417 383 L1417 414 L493 414 L493 389" fill="none" stroke="#174EA6" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="957" y="438" text-anchor="middle" class="body blue" style="font-weight:700">Feedback to improve prediction</text>
</svg>